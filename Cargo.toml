[package]
name = "freebj"
version = "1.2.2"
authors = ["Kévin Lesénéchal <kevin.lesenechal@gmail.com>"]
description = "Blackjack strategy simulator"
edition = "2024"
license = "MIT"
homepage = "https://freebj.lesenechal.fr/"
repository = "https://github.com/kevin-lesenechal/freebj"
categories = ["science", "simulation"]
keywords = ["blackjack", "card-counting"]

[lib]
name = "freebj"
path = "src/lib.rs"

[[bin]]
name = "freebj"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
incremental = false
debug = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = "2.34.0"
arrayvec = "0.7.2"
bitflags = "2.9.4"
rand = { version = "0.9.2", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam = "0.8.1"
regex = "1.4.2"
